# ========================
# 规则引擎（rules）
# ========================
rules:
  - DOMAIN,node.ytfbtk.top,直连
  - DOMAIN-SUFFIX,ytfbtk.top,直连

  - RULE-SET,TEST / Domain,Test
  - RULE-SET,AdBlock / Domain,广告拦截
  - RULE-SET,Block / Domain,Block

  # AI 组整合
  - RULE-SET,ChatGPT / Domain,AI工具
  - RULE-SET,Gemini / Domain,AI工具
  - RULE-SET,Meta AI / Domain,AI工具
  - RULE-SET,Perplexity / Domain,AI工具
    # Claude
  - RULE-SET,Claude / Domain,Claude

  # 独立保持不动
  - RULE-SET,GitHub / Domain,GitHub

  # Telegram 独立保留
  - RULE-SET,Telegram / Domain,Telegram
  - RULE-SET,Telegram / IP,Telegram,no-resolve

  # 社交组整合（包含原 Twitter、WhatsApp、Facebook、TikTok）
  - RULE-SET,Twitter / Domain,社交通讯
  - RULE-SET,WhatsApp / Domain,社交通讯
  - RULE-SET,Facebook / Domain,社交通讯
  - RULE-SET,TikTok / Domain,社交通讯

  # 独立保持不动
  - RULE-SET,Amazon / Domain,Amazon
  - RULE-SET,Apple-CN / Domain,Apple-CN
  - RULE-SET,Apple / Domain,Apple

  # 独立保持不动
  - RULE-SET,Microsoft / Domain,Microsoft

  # Crypto 虚拟货币保持独立
  - RULE-SET,OKX / Domain,Crypto
  - RULE-SET,Bybit / Domain,Crypto
  - RULE-SET,Binance / Domain,Crypto

  # YouTube 独立保留
  - RULE-SET,Youtube / Domain,YouTube

  # 流媒体组整合
  - RULE-SET,Netflix / Domain,流媒体
  - RULE-SET,Netflix / IP,流媒体,no-resolve
  - RULE-SET,Disney / Domain,流媒体
  - RULE-SET,HBO / Domain,流媒体
  - RULE-SET,Spotify / Domain,流媒体
  # Google 独立保留
  - RULE-SET,Google / Domain,Google
  - RULE-SET,Google / IP,Google,no-resolve

  # 基础分流
  - RULE-SET,Proxy / Domain,国外
  - RULE-SET,Globe / Domain,国外
  - RULE-SET,Direct / Domain,国内
  - RULE-SET,China / Domain,国内
  - RULE-SET,China / IP,国内,no-resolve
  - RULE-SET,Private / Domain,国内
  # WAN DHCP 自动追加的运营商/上级网关 DNS，不能落入最后的“其他”漏网组。
  - IP-CIDR,192.168.1.1/32,国内,no-resolve
  - MATCH,其他

# ========================
# 规则集提供者
# ========================
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
  class:
    &class { type: http, interval: 86400, behavior: classical, format: text }

rule-providers:
  AdBlock / Domain:
    type: http
    behavior: domain
    format: yaml
    url: "https://gh-proxy.com/raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    interval: 86400
  TEST / Domain:
    {
      <<: *class,
      url: "https://gh-proxy.com/raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Check.list",
    }
  ChatGPT / Domain:
    {
      <<: *domain,
      url: "https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/openai.mrs",
    }
  Claude / Domain:
    {
      <<: *class,
      url: "https://gh-proxy.com/raw.githubusercontent.com/qq892601987/clash/refs/heads/main/Claude.list",
    }
  Meta AI / Domain:
    {
      <<: *class,
      url: "https://gh-proxy.com/raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/MetaAi.list",
    }
  Perplexity / Domain:
    {
      <<: *domain,
      url: "https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/perplexity.mrs",
    }
  Copilot / Domain:
    {
      <<: *class,
      url: "https://gh-proxy.com/raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Copilot.list",
    }
  Gemini / Domain:
