# ========================
# Clash-ALL 优化配置
# ========================

# 机场节点订阅
proxy-providers:
  airport:
    url: "机场url"
    type: http
    path: ./proxy_providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: DIRECT
    exclude-filter: "(官网|到期|剩余|流量|更新)"

  airport2:
    url: "机场url"
    type: http
    path: ./proxy_providers/airport2.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: DIRECT
    exclude-filter: "(官网|到期|剩余|流量|更新)"
    override:
      additional-prefix: "[机场2] "
proxies:
  - { name: 直连, type: direct }
  - { name: 拒绝, type: reject }

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# 为国内 DoH 提供固定引导地址，避免启动阶段再依赖失效的 UDP/53。
hosts:
  "dns.alidns.com": 223.5.5.5

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16

  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.localdomain"
    - geosite:cn
    - "localhost.ptlogin2.qq.com"
    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "+.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"

    # 其他
    - "+.ynhtbank.com"
    - "+.qeayr.cn"
    - "+.saojc.xyz"
    - "+.sssyun.xyz"
    - "+.dler.cloud"
    - "+.0tk8a3a1q4t94dler.com"
    - "+.aerianas.top"
    - "+.gptacg.top"
    - "+.wxda.net"
    - "node.ytfbtk.top"
    - "+.ytfbtk.top"

  # Mihomo 要求 default-nameserver 必须是纯 IP；dns.alidns.com 已由顶层 hosts 固定引导。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver-policy:
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn":
      - "https://dns.alidns.com/dns-query#国内"
    "+.cn":
