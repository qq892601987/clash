# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
proxy-only: &proxy-only
  type: select
  proxies:
    - 所有-手动
    - 所有-自动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 其他-故转
  use:
    - airport
    - airport2

domestic: &domestic
  type: select
  proxies:
    - 直连

proxy-groups:
  # 业务分流组
  # 【整合大组】
  - { name: AI工具, <<: *proxy-only }
  - { name: 社交通讯, <<: *proxy-only }
  - { name: 流媒体, <<: *proxy-only }

  # 【精准保留的独立组】
  - { name: Claude, <<: *proxy-only }
  - { name: Telegram, <<: *proxy-only }
  - { name: YouTube, <<: *proxy-only }
  - { name: Google, <<: *proxy-only }
  - { name: Crypto, <<: *proxy-only }
  - { name: GitHub, <<: *proxy-only }
  - { name: Amazon, <<: *proxy-only }
  - { name: Apple-CN, <<: *domestic }
  - { name: Apple, <<: *proxy-only }
  - { name: Microsoft, <<: *proxy-only }

  # 基础分流与拦截组
  - { name: Test, <<: *proxy-only }
  - name: 广告拦截
    type: select
    proxies:
      - 拒绝
      - 直连
  - name: Block
    type: select
    proxies:
      - 拒绝
  - { name: 国外, <<: *proxy-only }
  - { name: 国内, <<: *domestic }
  - { name: 其他, <<: *proxy-only }

  - name: 所有-手动
    type: select
    use:
      - airport
      - airport2

  - name: 所有-自动
    type: url-test
    url: https://www.gstatic.com/generate_204
    use:
      - airport
      - airport2
    tolerance: 50
    interval: 300

  # 香港组
  - name: 香港-故转
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
    proxies:
      - 香港-手动
      - 香港-自动

  - name: 香港-手动
    type: select
    use:
      - airport
      - airport2
    filter: "(广港|香港|HK|Hong Kong|🇭🇰|HongKong)"

  - name: 香港-自动
    type: url-test
    url: https://www.gstatic.com/generate_204
    use:
      - airport
      - airport2
    tolerance: 50
    interval: 300
    filter: "(广港|香港|HK|Hong Kong|🇭🇰|HongKong)"

  # 台湾组
